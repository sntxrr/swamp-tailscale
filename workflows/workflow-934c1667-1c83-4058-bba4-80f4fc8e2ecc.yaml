id: 934c1667-1c83-4058-bba4-80f4fc8e2ecc
name: acl-drift-watch
description: >-
  Scheduled, unattended version of acl-drift-check: fetch the GitOps policy
  file, snapshot the live tailnet ACL, compare them, and raise an Apprise
  notification when they diverge.

  The point is the single-writer invariant. ACLs are applied by
  tailscale/gitops-acl-action on merge, so anything edited straight into the
  admin console is a change nobody reviewed and git does not know about. Drift
  detection already proved it catches exactly that; this workflow is what makes
  it notice without being asked.

  Read-only against the tailnet. The homelab-acl credential is scoped
  policy_file:read, so this cannot become a second writer even if the workflow
  is wrong -- the boundary is the credential, not this file.
tags: {}
# Fetches the policy file over the GitHub API (`gh api`) rather than cloning the
# repo over SSH. That is not a style preference -- an hourly unattended job must
# not depend on an interactive credential. The original `git ensure` step
# authenticated through the 1Password SSH agent, which enumerates keys from cron
# but refuses to SIGN with them, because cron runs outside the GUI session where
# 1Password can prompt for approval. It failed for 19 consecutive hours on
# 2026-07-31/08-01, each run burning the full 60s agent timeout, and the tailnet
# went unwatched the entire time. Comparison only ever needed policy.hujson, not
# a working tree, so the clone was buying nothing that justified that fragility.
#
# Deliberately has NO trigger, for the same reason the sibling propose-acl takes
# a path as a required input rather than defaulting it: the destination is
# operator-specific, and a schedule has nowhere to supply one without baking a
# single operator's home directory into a shared workflow. A trigger would not
# have fired anyway -- triggers only run under `swamp serve`, and nothing serves
# this repo. Run it hourly from cron instead:
#
#   swamp workflow run acl-drift-watch --repo-dir <repo> \
#     --input policyPath=<destination file>
#
# Hourly is plenty: ACL edits are rare and each run is three cheap API calls, so
# the cadence only bounds how long an out-of-band change can sit unnoticed.
inputs:
  properties:
    repo:
      type: string
      description: owner/repo of the GitOps ACL repository.
      default: sntxrr/tailscale-acls
    ref:
      type: string
      description: Branch or ref to read the policy file from.
      default: main
    policyPath:
      type: string
      description: >-
        Local file path to materialize policy.hujson at. Use a dedicated path,
        NOT a file in your working copy -- `sync` overwrites it whenever the
        upstream blob SHA changes. Required rather than defaulted: a default
        would be one operator's absolute home path, which is both wrong for
        everyone else and not something a shared repo should carry.
    notify:
      type: boolean
      description: >-
        When false, detect drift but stay silent. Useful for a manual run when
        you already know the tailnet is out of sync and don't want the ping.
      default: true
  required:
    - policyPath
jobs:
  - name: fetch
    description: Materialize the GitOps policy file from GitHub
    steps:
      - name: fetch-policy
        description: >-
          Pull policy.hujson via the GitHub API, rewriting the local copy only
          when the upstream blob SHA moved. Read-only against the repository:
          this cannot become a second ACL writer even if it is wrong.
        task:
          type: model_method
          modelIdOrName: acl-policy-file
          methodName: sync
          inputs:
            targets:
              - repo: ${{ inputs.repo }}
                ref: ${{ inputs.ref }}
                srcPath: policy.hujson
                destPath: ${{ inputs.policyPath }}
                label: tailnet-acl-policy
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: snapshot
    description: Fetch the ACL policy currently live on the tailnet
    steps:
      - name: get-live-acl
        description: Write a snapshot of the live policy for comparison
        task:
          type: model_method
          modelIdOrName: homelab-acl
          methodName: get
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: compare
    description: Compare the live snapshot against the policy file
    steps:
      - name: detect-drift
        description: Report any semantic divergence between tailnet and git
        task:
          type: model_method
          modelIdOrName: homelab-acl
          methodName: drift
          inputs:
            policyPath: ${{ inputs.policyPath }}
            liveInstance: current
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: fetch
        condition:
          type: succeeded
      - job: snapshot
        condition:
          type: succeeded
    weight: 1
  - name: alert
    description: Notify when, and only when, the tailnet has drifted from git
    steps:
      - name: notify-drift
        description: >-
          Raise an Apprise notification if the comparison found divergence.
          Gated by the model's own `when` argument rather than a step condition,
          because swamp step conditions are status-based (succeeded/failed) and
          cannot express a predicate over step output.
        task:
          type: model_method
          modelIdOrName: apprise
          methodName: notify
          inputs:
            title: 'Tailscale ACL drift'
            body: ${{ data.latest('homelab-acl', 'drift').attributes.summary }}
            type: warning
            format: markdown
            when: >-
              ${{ inputs.notify &&
              data.latest('homelab-acl', 'drift').attributes.inSync == false }}
        dependsOn: []
        weight: 0
        # A notification that cannot be delivered must not turn a successful
        # drift check into a failed run -- the drift result is already durable
        # in the data store. Matches the homelab convention that notify
        # failures are non-fatal.
        allowFailure: true
    dependsOn:
      - job: compare
        condition:
          type: succeeded
    weight: 2
version: 1
