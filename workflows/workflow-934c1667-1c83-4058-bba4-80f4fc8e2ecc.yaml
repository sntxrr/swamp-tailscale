id: 934c1667-1c83-4058-bba4-80f4fc8e2ecc
name: acl-drift-watch
description: >-
  Scheduled, unattended version of acl-drift-check: pull the GitOps policy repo,
  snapshot the live tailnet ACL, compare them, and raise an Apprise notification
  when they diverge.

  The point is the single-writer invariant. ACLs are applied by
  tailscale/gitops-acl-action on merge, so anything edited straight into the
  admin console is a change nobody reviewed and git does not know about. Drift
  detection already proved it catches exactly that; this workflow is what makes
  it notice without being asked.

  Read-only against the tailnet. The homelab-acl credential is scoped
  policy_file:read, so this cannot become a second writer even if the workflow
  is wrong -- the boundary is the credential, not this file.
tags: {}
# Deliberately has NO trigger, for the same reason the sibling propose-acl takes
# `repoPath` as a required input rather than defaulting it: the checkout
# directory is operator-specific, and a schedule has nowhere to supply one
# without baking a single operator's home directory into a shared workflow.
#
# A trigger would not have fired anyway -- triggers only run under `swamp serve`,
# nothing serves this repo, and the container has no GitHub SSH key for `ensure`
# to clone with. Run it hourly from cron instead:
#
#   swamp workflow run acl-drift-watch --repo-dir <repo> \
#     --input repoPath=<dedicated checkout directory>
#
# Hourly is plenty: ACL edits are rare and each run is two cheap API calls plus
# a git fetch, so the cadence only bounds how long an out-of-band change can sit
# unnoticed.
inputs:
  properties:
    project:
      type: string
      description: owner/repo of the GitOps ACL repository.
      default: sntxrr/tailscale-acls
    repoPath:
      type: string
      description: >-
        Local directory for the GitOps repo checkout. Use a dedicated path, NOT
        your working copy -- `ensure` fetches and pulls here, which will fight
        any uncommitted edits you have in flight. Required rather than
        defaulted: a default would be one operator's absolute home path, which
        is both wrong for everyone else and not something a shared repo should
        carry.
    notify:
      type: boolean
      description: >-
        When false, detect drift but stay silent. Useful for a manual run when
        you already know the tailnet is out of sync and don't want the ping.
      default: true
  required:
    - repoPath
jobs:
  - name: checkout
    description: Ensure the GitOps repo is cloned locally and up to date
    steps:
      - name: ensure-repo
        description: Clone or fast-forward the ACL policy repository
        task:
          type: model_method
          modelIdOrName: acl-repo
          methodName: ensure
          inputs:
            project: ${{ inputs.project }}
            localPath: ${{ inputs.repoPath }}
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: snapshot
    description: Fetch the ACL policy currently live on the tailnet
    steps:
      - name: get-live-acl
        description: Write a snapshot of the live policy for comparison
        task:
          type: model_method
          modelIdOrName: homelab-acl
          methodName: get
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: compare
    description: Compare the live snapshot against the policy file
    steps:
      - name: detect-drift
        description: Report any semantic divergence between tailnet and git
        task:
          type: model_method
          modelIdOrName: homelab-acl
          methodName: drift
          inputs:
            policyPath: ${{ inputs.repoPath }}/policy.hujson
            liveInstance: current
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: checkout
        condition:
          type: succeeded
      - job: snapshot
        condition:
          type: succeeded
    weight: 1
  - name: alert
    description: Notify when, and only when, the tailnet has drifted from git
    steps:
      - name: notify-drift
        description: >-
          Raise an Apprise notification if the comparison found divergence.
          Gated by the model's own `when` argument rather than a step condition,
          because swamp step conditions are status-based (succeeded/failed) and
          cannot express a predicate over step output.
        task:
          type: model_method
          modelIdOrName: apprise
          methodName: notify
          inputs:
            title: 'Tailscale ACL drift'
            body: ${{ data.latest('homelab-acl', 'drift').attributes.summary }}
            type: warning
            format: markdown
            when: >-
              ${{ inputs.notify &&
              data.latest('homelab-acl', 'drift').attributes.inSync == false }}
        dependsOn: []
        weight: 0
        # A notification that cannot be delivered must not turn a successful
        # drift check into a failed run -- the drift result is already durable
        # in the data store. Matches the homelab convention that notify
        # failures are non-fatal.
        allowFailure: true
    dependsOn:
      - job: compare
        condition:
          type: succeeded
    weight: 2
version: 1
